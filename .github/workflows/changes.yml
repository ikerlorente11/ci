name: Cambios

# Qué carpetas ha tocado el push (o la PR), para que cada proyecto de un repo con varios solo se pruebe y se
# construya cuando cambia él. Se da todo por cambiado con cron, lanzado a mano, en el primer push de una rama
# o cuando cambian los propios workflows (.github/**).
#
#   jobs:
#     changes:
#       uses: ikerlorente11/ci/.github/workflows/changes.yml@main
#       with:
#         filters: |
#           estanteria: ['estanteria/service/**']
#           webs: ['*/web/**', 'pdfmerge/**']
#     estanteria:
#       needs: changes
#       if: contains(fromJSON(needs.changes.outputs.changed), 'estanteria')
#       uses: ikerlorente11/ci/.github/workflows/python.yml@main
#       ...

on:
  workflow_call:
    inputs:
      filters:
        description: Filtros (YAML de dorny/paths-filter), un nombre por proyecto con sus rutas
        type: string
        required: true
    outputs:
      changed:
        description: Lista JSON con los nombres de los filtros que han cambiado
        value: ${{ jobs.look.outputs.changed }}

jobs:
  look:
    name: cambios
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && github.event.before != '0000000000000000000000000000000000000000'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ${{ inputs.filters }}
            __workflows__: ['.github/**']
          # en un push compara con el commit anterior (varios commits de golpe se suman)
          base: ${{ github.event.before || github.event.repository.default_branch }}
      - id: decide
        env:
          FILTERS: ${{ inputs.filters }}
          FOUND: ${{ steps.filter.outputs.changes || '[]' }}
          EVERYTHING: ${{ steps.filter.outcome == 'skipped' || contains(fromJSON(steps.filter.outputs.changes || '[]'), '__workflows__') }}
        run: |
          if [ "$EVERYTHING" = "true" ]; then
            changed=$(printf '%s\n' "$FILTERS" | grep -E '^[A-Za-z0-9_-]+:' | sed 's/:.*//' | jq -R . | jq -cs .)
          else
            changed=$(printf '%s' "$FOUND" | jq -c 'map(select(. != "__workflows__"))')
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Cambiado: $changed"
