name: Tests Node

on:
  workflow_call:
    inputs:
      directory:
        description: Carpeta con package.json
        type: string
        default: "."
      node:
        type: string
        default: "22"
      manager:
        description: npm o pnpm
        type: string
        default: npm
      pnpm:
        description: Versión de pnpm (si manager es pnpm)
        type: string
        default: "10.17.1"
      install:
        description: Instalación (por defecto npm ci / pnpm install --frozen-lockfile)
        type: string
        default: ""
      test:
        description: Comprobaciones tras instalar (tests, tipos, build…)
        type: string
        default: npm test

jobs:
  test:
    name: ${{ inputs.directory == '.' && 'node' || inputs.directory }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.directory }}
    env:
      LOCK: ${{ inputs.directory }}/${{ inputs.manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}
    steps:
      - uses: actions/checkout@v4
      - if: inputs.manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node }}
          # Sin lockfile en el repo no hay con qué indexar la caché.
          cache: ${{ hashFiles(env.LOCK) != '' && inputs.manager || '' }}
          cache-dependency-path: ${{ env.LOCK }}
      - run: ${{ inputs.install != '' && inputs.install || (inputs.manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci --no-audit --no-fund') }}
      - run: ${{ inputs.test }}
