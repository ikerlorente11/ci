name: Tests Python

on:
  workflow_call:
    inputs:
      directory:
        description: Carpeta del proyecto Python
        type: string
        default: "."
      python:
        type: string
        default: "3.12"
      deps:
        description: Fichero de dependencias (para la caché de pip), relativo a directory
        type: string
        default: pyproject.toml
      cache:
        description: Caché de pip (false si el proyecto no instala dependencias)
        type: boolean
        default: true
      apt:
        description: Paquetes del sistema que necesitan los tests (apt-get)
        type: string
        default: ""
      install:
        type: string
        default: pip install -q ".[dev]"
      test:
        type: string
        default: python -m pytest -q

jobs:
  test:
    name: ${{ inputs.directory == '.' && 'python' || inputs.directory }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python }}
          cache: ${{ inputs.cache && 'pip' || '' }}
          cache-dependency-path: ${{ inputs.directory }}/${{ inputs.deps }}
      - if: inputs.apt != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ${{ inputs.apt }}
      - run: ${{ inputs.install }}
      - run: ${{ inputs.test }}
