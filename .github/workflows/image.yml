name: Imagen

# Construye una imagen y la sube a GHCR (ghcr.io/<dueño>/<name>:latest y :<sha>), que es lo que descargan las Pis.
# Repos públicos: runner ARM nativo (gratis solo para públicos). Privados o sin datos del repo (cron): x86 + QEMU.
# Con cron (reconstrucción semanal) no usa caché: así entran las actualizaciones de la imagen base y de las dependencias.

on:
  workflow_call:
    inputs:
      name:
        description: Nombre de la imagen (sin ghcr.io/<dueño>/)
        type: string
        required: true
      context:
        description: Contexto de build
        type: string
        default: "."
      file:
        description: Dockerfile (por defecto <context>/Dockerfile)
        type: string
        default: ""
      platforms:
        type: string
        default: linux/arm64

jobs:
  build:
    name: ${{ inputs.name }}
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - if: runner.arch != 'ARM64'
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Imagen reproducible: con la fecha fija y sin la atestación de procedencia (que lleva el commit), si nada de lo
      # que entra en la imagen ha cambiado sale idéntica (mismo digest), y `docker compose up -d` no reinicia nada.
      # Por eso `docker images` las muestra creadas en 1970.
      - uses: docker/build-push-action@v6
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          provenance: false
          context: ${{ inputs.context }}
          file: ${{ inputs.file != '' && inputs.file || format('{0}/Dockerfile', inputs.context) }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=${{ inputs.name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.name }}
